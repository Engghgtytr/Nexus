services:
  - type: web
    name: nexus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: NEXUS_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString

databases:
  - name: nexus-db
    plan: free
